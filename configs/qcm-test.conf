# Sample configuration for quectel-cm-test.
# Lines beginning with # or ; are ignored.

# Existing quectel-CM options
cm_path=./out/quectel-CM
apn=internet
user=
password=
auth=
pin=
proxy=
interface=wwan0
pdp=1
qmap_iface_idx=
ipv4=1
ipv6=0
no_dhcp=0
udhcpc_script=scripts/default.script_ip
bridge=0
verbose=0

# Test cycle options
connect_duration_sec=120
connection_times=3
sleep_between_sec=30
connect_wait_sec=30
status_interval_sec=30

# Logging
log_dir=log
log_file=qcm-test.log
cm_log_file=qcm-test.log

# RAT and band selection.
# Friendly names are resolved through at_map_file before each connection cycle.
at_device=/dev/ttyUSB2
at_map_file=configs/qcm-at-map.conf
rat=auto
band=

# Modem information commands logged during each status snapshot.
info_commands=AT+QNWINFO|AT+QCSQ|AT+COPS?|AT+CGREG?|AT+CEREG?|AT+C5GREG?
# info_commands=AT+QNWINFO

# Ping is log-only. A ping failure is recorded but does not trigger reconnect.
ping_enable=1
ping_address=8.8.8.8
ping_count=1
ping_timeout_sec=5
at_timeout_sec=5