# Friendly RAT/band names used by quectel-cm-test.
# Verify the actual AT commands against your Quectel module and firmware.
# Multiple commands for one key can be separated with '|'.

# Common examples for modules that support AT+QNWPREFCFG.
rat.auto=AT+QNWPREFCFG="mode_pref",AUTO
rat.lte=AT+QNWPREFCFG="mode_pref",LTE
rat.nr5g=AT+QNWPREFCFG="mode_pref",NR5G
rat.lte_nr5g=AT+QNWPREFCFG="mode_pref",LTE:NR5G

# Band examples. Leave band= empty in qcm-test.conf if you do not want to set band.
# lte_all intentionally sends no band command by default, so the modem keeps its
# current/all/default LTE band configuration. Edit this line if your module has a
# verified command to restore all LTE bands.
band.lte_all=
band.lte_b3_b7=AT+QNWPREFCFG="lte_band",3:7
band.lte_b1_b3_b7_b8=AT+QNWPREFCFG="lte_band",1:3:7:8
band.nr_all=
band.nr_n78=AT+QNWPREFCFG="nr5g_band",78
band.nr_n41_n78=AT+QNWPREFCFG="nr5g_band",41:78