# 4G LTE, all/default modem LTE bands, keep connected until Ctrl+C/SIGTERM.
# band=lte_all is resolved in qcm-at-map.conf and can be edited for your module.

connect_duration_sec=0
connection_times=1
sleep_between_sec=0
udhcpc_script=scripts/default.script_ip

log_dir=log
log_file=qcm-4g-all-bands-keep.log
cm_log_file=qcm-4g-all-bands-keep.log

at_device=/dev/ttyUSB2
at_map_file=configs/qcm-at-map.conf
rat=lte
band=lte_all

# info_commands=AT+QNWINFO|AT+QCSQ|AT+COPS?|AT+CGREG?|AT+CEREG?|AT+C5GREG?
info_commands=AT+QNWINFO
interface=wwan0