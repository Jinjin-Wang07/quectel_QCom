# 5G NR n78, connect for 10 seconds, sleep 5 seconds, repeat 10 times.
# Other fields stay at quectel-cm-test defaults or modem/quectel-CM defaults.

connect_duration_sec=10
connection_times=10
sleep_between_sec=5
udhcpc_script=scripts/default.script_ip

log_dir=log
log_file=qcm-5g-n78-cycle.log
cm_log_file=qcm-5g-n78-cycle.log

at_device=/dev/ttyUSB2
at_map_file=configs/qcm-at-map.conf
rat=nr5g
band=nr_n78

# info_commands=AT+QNWINFO|AT+QCSQ|AT+COPS?|AT+CGREG?|AT+CEREG?|AT+C5GREG?
info_commands=AT+QNWINFO